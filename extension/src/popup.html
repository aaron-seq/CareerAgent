<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; font-size: 12px; margin-top: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 4px; }
      textarea { width: 100%; box-sizing: border-box; padding: 4px;
                 font-family: monospace; font-size: 11px; }
      button { margin-top: 10px; width: 100%; padding: 8px; cursor: pointer; }
      details { margin-top: 10px; }
      summary { font-size: 12px; cursor: pointer; }
      .fill { background: #4caf50; color: #fff; border: none; }
      .note { font-size: 11px; color: #666; margin-top: 8px; }
      #status { font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>CareerAgent Autofill</h1>
    <label>Full name <input id="fullName" /></label>
    <label>Email <input id="email" /></label>
    <label>Phone <input id="phone" /></label>
    <label>LinkedIn <input id="linkedin" /></label>
    <label>GitHub <input id="github" /></label>
    <label>Portfolio <input id="portfolio" /></label>
    <label>Location <input id="location" /></label>
    <details>
      <summary>Import from CareerAgent</summary>
      <label>Paste the profile JSON from the app's Export screen
        <textarea id="importJson" rows="4"
                  placeholder='{"fullName": "...", "email": "..."}'></textarea>
      </label>
      <button id="import">Import</button>
    </details>
    <button id="save">Save profile</button>
    <button id="fill" class="fill">Autofill this page</button>
    <div class="note">
      Fills fields only. You review and click submit yourself &mdash; this
      extension never submits a form for you.
    </div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
