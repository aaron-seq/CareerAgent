services:
  careeragent:
    build: .
    container_name: careeragent-app
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - DATABASE_URL=sqlite:////app/careeragent_data/careeragent.db
      - CAREERAGENT_KEY_PATH=/app/careeragent_data/.careeragent_key
      - CAREERAGENT_ENCRYPTION_KEY=${CAREERAGENT_ENCRYPTION_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - careeragent-data:/app/careeragent_data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama:0.40.4
    container_name: careeragent-ollama
    environment:
      - OLLAMA_NO_CLOUD=1
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    command: serve

volumes:
  careeragent-data:
    driver: local
  ollama-data:
    driver: local
