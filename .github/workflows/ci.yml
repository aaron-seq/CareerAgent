name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # Weekly: frozen audit plus unconstrained upstream drift.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/locks/test-py311.txt

      - name: Run lint and format checks
        run: python -m scripts.check lint

      - name: Run required type check
        run: python -m scripts.check type

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/locks/test-py*.txt
      
      - name: Install frozen dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          LOCK="requirements/locks/test-py${PYTHON_VERSION//./}.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "$LOCK"
      
      - name: Run pytest
        run: python -m scripts.check test
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          disable_telem: true

  dependencies:
    name: Dependency audit (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ['311', '312', '313']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Audit tooling has its own graph, separate from the application graph.
      # Target files already encode each supported interpreter's resolution.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/locks/audit-py311.txt

      - name: Install frozen audit tool
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/locks/audit-py311.txt

      - name: Audit resolved application and test graph against PyPI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m pip_audit --strict --vulnerability-service pypi \
            --disable-pip --require-hashes \
            -r "requirements/locks/test-py${TARGET}.txt" \
            --format json --output "dependency-audit-py${TARGET}.json"

      - name: Preserve advisory report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-py${{ matrix.target }}
          path: dependency-audit-py${{ matrix.target }}.json
          if-no-files-found: warn

  drift:
    name: Upstream drift (${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Intentionally resolve manifest ranges; never update committed locks here.
      - name: Resolve current upstream versions
        run: python -m pip install -r requirements-test.txt

      - name: Record resolved upstream graph
        if: always()
        run: python -m pip freeze > upstream-resolved.txt

      - name: Test upstream compatibility
        run: python -m scripts.check test

      - name: Preserve resolved graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-resolved-py${{ matrix.python-version }}
          path: upstream-resolved.txt

  extension:
    name: Extension Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run field-mapping tests
        working-directory: extension
        run: node --test

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, dependencies]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Build and validate Docker startup
        run: python3 -m scripts.check docker
